[package]
name = "open-ledger-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "open_ledger_crypto"
# cdylib  → Android (.so via jniLibs) + iOS dynamic framework
# staticlib → iOS (.a, statically linked into Runner → DynamicLibrary.process())
crate-type = ["cdylib", "staticlib"]

[dependencies]
open-ledger-crypto = { path = "../open-ledger-crypto" }
open-ledger-biz = { path = "../open-ledger-biz" }
chain-app-api = { path = "../chain-app-api" }
chain-app-runtime = { path = "../chain-app-runtime" }
chain-app-ethereum = { path = "../chain-app-ethereum" }
chain-app-bitcoin = { path = "../chain-app-bitcoin" }
chain-app-solana = { path = "../chain-app-solana" }
chain-app-tron = { path = "../chain-app-tron" }
chain-app-sui = { path = "../chain-app-sui" }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["all"]
all = ["eth", "sol", "btc", "tron", "sui"]
eth = []
sol = []
btc = []
tron = []
sui = []

[dev-dependencies]
ed25519-dalek = { workspace = true }
