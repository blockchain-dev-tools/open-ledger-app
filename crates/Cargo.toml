[workspace]
resolver = "2"
members = [
    "open-ledger-crypto",
    "open-ledger-biz",
    "open-ledger-ur",
    "open-ledger-ffi",
    "chain-app-api",
    "chain-app-runtime",
    "chain-app-ethereum",
    "chain-app-bitcoin",
    "chain-app-solana",
    "chain-app-tron",
    "chain-app-sui",
    "chain-app-near",
    "chain-app-ton",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bip39 = { version = "2", features = [
    "rand",
    "chinese-simplified",
    "chinese-traditional",
    "czech",
    "french",
    "italian",
    "japanese",
    "korean",
    "portuguese",
    "spanish",
] }
rand = "0.8"
bip32 = "0.5"
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
chacha20poly1305 = "0.10"
bech32 = "0.11"
bs58 = "0.5"
hex = "0.4"
rlp = { version = "0.5", default-features = false }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
zeroize = "1"
