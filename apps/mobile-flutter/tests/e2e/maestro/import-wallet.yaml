# Import Wallet flow
# Preq: Fresh install (no prior wallet data)
appId: app.openledger.mobile
---
# Step 1: Welcome screen -> tap Import Existing
- tapOn:
    id: "entry-import"
- waitFor: "Import Wallet"
  timeout: 5000

# Step 2: Type mnemonic
- inputText:
    id: "mnemonic-input"
    text: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# Step 3: Wait for validation
- assertVisible: "Valid phrase"
- tapOn:
    id: "import-btn"

# Step 4: Set PIN phase 1
- assertVisible: "Create PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"

# Step 5: Confirm PIN
- waitFor: "Confirm PIN"
  timeout: 3000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"

# Step 6: Verify Vault shows chain sections
- waitFor: "Open Ledger App"
  timeout: 10000
- assertVisible: "Ethereum"
- assertVisible: "Solana"
- assertNotVisible: "Bitcoin"
- assertVisible: "Tron"
- assertNotVisible: "Sui"

# Step 7: Kill and restart
- stopApp
- startApp

# Step 8: Unlock
- waitFor: "Enter PIN"
  timeout: 5000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"

# Step 9: Verify unlock -> Vault
- waitFor: "Open Ledger App"
  timeout: 10000
- assertVisible: "Ethereum"
- assertVisible: "Solana"
